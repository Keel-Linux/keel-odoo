manifest_version: 1
kind: appliance
name: odoo
title: Keel Odoo
summary: Odoo 18.0 behind Nginx on the LNPP stack, alone or as a replicated pair (0059)
base: lnpp
# No overlay and no process of its own. The overlays and the PostgreSQL
# process are those of Core, Web and LNPP. Odoo runs on the node whose
# PostgreSQL is writable, and usr/lib/keel-odoo/follow.py starts and stops
# it, so a manifest process would make Monit start Odoo on a standby. Odoo
# listens on the loopback, so the firewall has nothing to add.
#
# state: the paths Odoo writes at run time (0050's amendment of
# 2026-10-20, item 2, and docs/manifest-v1.md). On a database pair one
# Syncthing folder replicates each, send-only on the primary and
# receive-only on the replica. /var/lib/odoo/sessions is inside neither
# path, so it replicates nowhere and needs no exclude (rule 23 of
# docs/manifest-v1.md): sessions are files of one node and are not state
# to move.
state:
  replicate:
    - /var/lib/odoo/filestore
    - /opt/odoo/extra-addons
