# Odoo 18.0 on Keel LNPP (handbook decision 0059). A conffile of the image;
# firstboot.d/45odoo sets admin_passwd. Odoo reads it with no interpolation.
[options]
# One database. A name here also stops the database selector.
db_name = odoo
db_user = odoo
# No db_host and no db_password: Odoo connects on the unix socket and
# PostgreSQL authenticates the operating system user odoo by peer.
data_dir = /var/lib/odoo
addons_path = /opt/odoo/18.0/addons,/opt/odoo/extra-addons
# Nginx is the only listener the network reaches. The ports are on the
# loopback, and Nginx (60-keel-odoo.conf) proxies to them.
http_interface = 127.0.0.1
http_port = 8069
gevent_port = 8072
proxy_mode = True
list_db = False
# 2 HTTP workers and 1 for the cron jobs. The gevent worker answers /websocket.
workers = 2
max_cron_threads = 1
# Empty: Odoo does not accept any master password until the first boot hook
# sets a hash here.
admin_passwd =
