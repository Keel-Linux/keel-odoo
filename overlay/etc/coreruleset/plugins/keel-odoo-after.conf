# keel-odoo: the fields of an Odoo JSON-RPC call that hold a file are not
# read by the Core Rule Set (handbook decision 0030, overlay coraza).
#
# Odoo sends a file as base64 text in a field of the call: datas and
# db_datas of an attachment, raw, and the image fields (image_1920 and its
# sizes). The JSON body processor of Coraza makes an argument of each, named
# json.params.args.0.datas for example. The Core Rule Set then reads the
# whole text with every rule. It needs about 20 s of CPU for each MiB, and
# it finds "OS File Access Attempt" (rule 930120) and the like in random
# bytes, so a file of 1 MB got 403.
#
# This update takes these argument names out of the targets of the rules
# that carry the tag OWASP_CRS. It is a static update, loaded after the
# rules: a ctl at run time costs more (measured: the same 1 MB needed 49 s
# in place of 0.6 s). The name must begin with json.params.args or
# json.params.kwargs and end with one of the field names, so every other
# field of the call, the names of the arguments, the headers, the path and
# the query keep all their rules. A test showed that a SQL injection text in
# the name field of the same call still answers 403. Odoo decodes the base64
# text and stores it as data: it never runs it.
#
# Rule ids and this update are Keel's. Coraza stops every Nginx worker at the
# next reload if it refuses a directive (coraza-nginx#139): turn the overlay
# off and on again with /usr/lib/keel/overlays/coraza/state after a change.
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:/^json\.params\.(?:args|kwargs)\.(?:.*\.)?(?:datas|db_datas|raw|image_[0-9]+)$/"
