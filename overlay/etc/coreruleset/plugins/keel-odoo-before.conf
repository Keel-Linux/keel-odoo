# keel-odoo: an exclusion of the OWASP Core Rule Set for the routes of Odoo,
# loaded by /usr/share/coreruleset/coreruleset.load before the rules (the
# plugin mechanism of CRS 4). It has effect only while the coraza overlay of
# Keel Web is enabled. Rule ids 10100 to 10109 are this layer's, in the range
# that ModSecurity leaves to local rules; 10000 to 10099 are Keel's.
#
# Odoo calls a method of a model through /web/dataset/call_kw/MODEL/METHOD,
# and a model is named like a Python module: res.config.settings is the page
# of the Settings app, res.users.settings the preferences of a user. CRS
# 930130 ("Restricted File Access Attempt") finds ".settings/" in the path,
# as it would in the path of an Eclipse project, and with the score of 5 it
# blocked the Settings app (403 on res.config.settings/get_views).
#
# The rule below ends the check of REQUEST_FILENAME by 930130 for these
# routes only, and for that one rule. 930130 reads REQUEST_FILENAME and
# nothing else, so for these routes it is off, and for every other path it
# is on. The model is a name of words joined by single dots, so it cannot
# hold a slash or a dot segment, and the path cannot name a file. The other
# rules still read the path, the arguments and the headers: 930110 (path
# traversal), 930120 (OS file access in an argument) and the rest. A rule
# that Coraza refuses stops every Nginx worker at the next reload
# (coraza-nginx#139): turn the overlay off and on again with
# /usr/lib/keel/overlays/coraza/state after a change.
SecRule REQUEST_FILENAME "@rx ^/web/dataset/(?:call_kw|call_button)/[a-z0-9_]+(?:\.[a-z0-9_]+)*/[a-z0-9_]+$" \
    "id:10100,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetById=930130;REQUEST_FILENAME"

# keel-overlay-coraza 0.1.4 refuses a form, JSON or XML body of more than
# 256 KiB with 413 (rule 10012; Keel-Linux/common#61). Odoo sends a file as
# base64 inside a JSON-RPC call (ir.attachment create, the image field of a
# record), and the web client does so for the files that it reads into the
# page. A file of 10 MB is a body of 13.4 MB. So for a POST or PUT of JSON to
# the JSON-RPC routes, and for those only, this rule sets the limit again,
# to 16 MiB, after the rule of the overlay in the same phase. The multipart
# upload of the web client has no such limit: a file in it is no argument.
#
# Measured on 2026-10-18 on a container of 3 GB with Coraza 0.21.0 and the
# Core Rule Set 4.25.1: a call with 10 MB of data took 2.4 s, and the
# largest Nginx worker grew from 56 MB to 136 MB. A call of 23 MB took 5.7 s
# and 231 MB, so the limit stays at 16 MiB. The Core Rule Set needs 20 s of
# CPU for each MiB of base64 text if it reads the field, and it blocks the
# call: random bytes of a file contain "/etc/..." and the like. So
# keel-odoo-after.conf takes the base64 fields out of its targets.
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT)$" \
    "id:10102,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@rx ^/(?:web/dataset/(?:call_kw|call_button)/|jsonrpc$)" "chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" \
            "t:none,t:lowercase,ctl:requestBodyLimit=16777216"
