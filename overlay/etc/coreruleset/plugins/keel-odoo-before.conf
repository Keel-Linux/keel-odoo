# keel-odoo: an exclusion of the OWASP Core Rule Set for the routes of Odoo,
# loaded by /usr/share/coreruleset/coreruleset.load before the rules (the
# plugin mechanism of CRS 4). It has effect only while the coraza overlay of
# Keel Web is enabled. Rule ids 10100 to 10109 are this layer's, in the range
# that ModSecurity leaves to local rules; 10000 to 10099 are Keel's.
#
# Odoo calls a method of a model through /web/dataset/call_kw/MODEL/METHOD,
# and a model is named like a Python module: res.config.settings is the page
# of the Settings app, res.users.settings the preferences of a user. CRS
# 930130 ("Restricted File Access Attempt") finds ".settings/" in the path,
# as it would in the path of an Eclipse project, and with the score of 5 it
# blocked the Settings app (403 on res.config.settings/get_views).
#
# The rule below ends the check of REQUEST_FILENAME by 930130 for these
# routes only, and for that one rule. The model is [a-z0-9_.]+ and cannot
# hold a slash or a dot segment, so the path cannot name a file. Every other
# rule still reads the path, and 930130 still reads every argument, every
# header and every other path. A rule that Coraza refuses stops every Nginx
# worker at the next reload (coraza-nginx#139): turn the overlay off and on
# again with /usr/lib/keel/overlays/coraza/state after a change.
SecRule REQUEST_FILENAME "@rx ^/web/dataset/(?:call_kw|call_button)/[a-z0-9_.]+/[a-z0-9_]+$" \
    "id:10100,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetById=930130;REQUEST_FILENAME"
