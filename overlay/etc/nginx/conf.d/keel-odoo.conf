# keel-odoo: two maps for the route in /etc/nginx/keel-default.d/60-keel-odoo.conf.

# The websocket needs the Upgrade header, and any other request closes.
map $http_upgrade $keel_odoo_connection {
	default upgrade;
	'' close;
}

# The protocol that Odoo sees. In the simple mode the server on port 443 or
# 80 knows it. In the cloud modes Anubis hands the request back on the unix
# socket of Nginx, where the scheme is http. The front of keel-web sets
# X-Forwarded-Proto to the scheme of the request (keel-overlay-anubis's
# snippet), over what the client sent, and the server on the socket listens
# only for what Anubis allowed. Since keel-web 0.4.0 (handbook decision
# 0079) that is http on port 80 while the certificate is self-signed, so
# the socket says http for http and https for anything else, as before.
map $http_x_forwarded_proto $keel_odoo_front_proto {
	default https;
	http http;
}

map $server_addr $keel_odoo_proto {
	default $scheme;
	~^unix: $keel_odoo_front_proto;
}

# The cache of the asset bundles of Odoo, for the front of the cloud modes
# (/etc/nginx/keel-front.d/61-keel-odoo-assets.conf). Anubis answers a
# request without its cookie with the challenge page, also for a style
# sheet, and the challenge deletes the browser's pass: a page of the
# livechat on another site, an old backend tab or a changed policy got
# HTML for its CSS (CT 9390, BR1, 2026-11-07). The front serves a bundle
# that Odoo already sent through Anubis from this cache, and asks Anubis
# for any other. conf.d/main makes the directory: Nginx does not make its
# parent, and `nginx -t` fails without it.
proxy_cache_path /var/cache/nginx/keel-odoo-assets levels=1:2 keys_zone=keel_odoo_assets:4m max_size=256m inactive=30d use_temp_path=off;

# The cache stores a reply only when Odoo marked it immutable (the
# bundles: public, max-age=31536000, immutable) and it sets no cookie.
# The challenge of Anubis (no-store and Set-Cookie) and the redirect of a
# wrong hash are never stored.
map $upstream_http_cache_control $keel_odoo_asset_nocache {
	default 1;
	"~immutable" 0;
}

map $upstream_http_set_cookie $keel_odoo_asset_cookie {
	default 1;
	"" 0;
}
