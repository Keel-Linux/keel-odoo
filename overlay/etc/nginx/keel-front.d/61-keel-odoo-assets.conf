# keel-odoo: the hashed asset bundles of Odoo from a cache, in front of
# Anubis (the cloud modes; the cache and its two maps are in
# conf.d/keel-odoo.conf).
#
# The path is /web/assets/[WEBSITE/]HASH/BUNDLE.min.css or .js. Odoo
# makes the bundle on the first request and writes it to the database, so
# the path is not exempt from Anubis: a miss goes through Anubis as every
# request does. Only a reply that Anubis let through, that Odoo marked
# immutable and that sets no cookie is stored
# (keel-default.d/59-keel-odoo-assets.conf takes the cookies away). A hit
# is the same public bytes for every user, and it uses no worker of Odoo
# and no database. A hash that is not hexadecimal and any other path do
# not match, and go through Anubis.
#
# Nginx matches a location without the query string, so a bundle with a
# query string matches too. It is neither read from the cache nor stored
# ($args): a client that Anubis allows must not fill an entry that a
# client without the cookie then gets, and no query string fills the cache.
#
# The key is the host and the URI: an entry serves only that address.
#
# Nginx takes the first regular expression that matches, in the order of
# the server. keel-web includes keel-front.d before its own locations, so
# this one comes before the static files of keel-web 0.4.2
# (keel-static.d): a bundle is no file on the disk.
location ~ "^/web/assets/(?:[0-9]+/)?[0-9a-f]{7,}/[A-Za-z0-9_.-]+\.(?:css|js)$" {
	include /etc/nginx/snippets/keel-anubis.conf;
	proxy_cache keel_odoo_assets;
	proxy_cache_key $host$request_uri;
	proxy_cache_lock on;
	proxy_cache_bypass $args;
	proxy_no_cache $keel_odoo_asset_nocache $keel_odoo_asset_cookie $args;
	add_header X-Keel-Cache $upstream_cache_status always;
}
