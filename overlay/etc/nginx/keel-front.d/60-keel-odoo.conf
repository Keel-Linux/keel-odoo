# keel-odoo: the body limit of the front site (Keel-Linux/keel-web#15).
#
# Behind Anubis (the cloud modes) the front site of Keel Web receives a
# request first and hands it to Anubis, and its own limit is 1 MB. An upload
# of an attachment is larger, so it answered 413 before it reached the route
# of 60-keel-odoo.conf in keel-default.d. This file sets the limit that the
# route has: 256 MB, as the route.
#
# It needs keel-web 0.3.2, which includes /etc/nginx/keel-front.d/*.conf in
# its front server, after its own limit, and keel-overlay-coraza 0.1.4.
# That rule set reads no file of a multipart upload as an argument, and it
# refuses a form, JSON or XML body of more than 256 KiB. The plugin
# keel-odoo-before.conf sets the limit of a JSON-RPC call again.
client_max_body_size 256m;
