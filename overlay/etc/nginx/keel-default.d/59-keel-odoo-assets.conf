# keel-odoo: the hashed asset bundles of Odoo, without the cookies
# (keel-front.d/61-keel-odoo-assets.conf stores them in the front's cache).
#
# The same route as `location ~ ^/` of 60-keel-odoo.conf, for the path of
# the front's location only. Nginx takes the first regular expression that
# matches, and `~ ^/` matches every path, so this file must load before
# 60-keel-odoo.conf (keel-web includes keel-default.d/*.conf in the order
# of the names).
#
# Odoo gets no Cookie, and the client gets no Set-Cookie. Odoo then serves
# the bundle as the public user and sends no session cookie, so the front
# can store it, and the session of a user never goes into the cache. The
# bundles of the backend (/odoo) are the same bytes for the public user
# and for the admin (CT 9390, BR1, 2026-11-07).
location ~ "^/web/assets/(?:[0-9]+/)?[0-9a-f]{7,}/[A-Za-z0-9_.-]+\.(?:css|js)$" {
	if (-f /run/keel-odoo/replica) {
		rewrite ^ /keel-odoo-replica.html last;
	}
	client_max_body_size 256m;
	proxy_pass http://127.0.0.1:8069;
	proxy_http_version 1.1;
	proxy_connect_timeout 5s;
	proxy_read_timeout 720s;
	proxy_send_timeout 720s;
	proxy_redirect off;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Proto $keel_odoo_proto;
	proxy_set_header Cookie "";
	proxy_hide_header Set-Cookie;
}
