# keel-odoo: the routes of Odoo (handbook decision 0059, points 4 and 6),
# included by keel-web's default site and by its server behind Anubis. They
# stand beside /keel-check/ of the lnpp layer.
#
# keel-web's sites end with `location / { try_files ... =404; }`. A second
# `location /` is a duplicate, and so is `location ^~ /` (nginx -t:
# duplicate location "/"). A regular expression is neither. Nginx tries
# the regular expressions after the longest prefix, so `location ~ ^/`
# takes every request that no exact match (/keel-health, /404.html) and no
# prefix with ^~ (/keel-check/, /websocket) took.
#
# Odoo listens on the loopback only, and its cron jobs and writes run on
# the node whose PostgreSQL is writable (usr/lib/keel-odoo/serve.py). On a
# standby nothing listens on 8069. There serve.py writes
# /run/keel-odoo/replica, and each page of Odoo is the notice of the
# replica, which says why and where Odoo serves: before, Nginx answered 502
# with the 50x page of keel-web, which said nothing (BR2, 2026-11-06). The
# notice answers 200, as the login page of the WordPress replica does. With
# no mark (a primary whose Odoo stopped) the 502 stays. `rewrite ... last`
# is one of the two directives that are safe in an `if` of a location.
location ~ ^/ {
	if (-f /run/keel-odoo/replica) {
		rewrite ^ /keel-odoo-replica.html last;
	}
	client_max_body_size 256m;
	proxy_pass http://127.0.0.1:8069;
	proxy_http_version 1.1;
	proxy_connect_timeout 5s;
	proxy_read_timeout 720s;
	proxy_send_timeout 720s;
	proxy_redirect off;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Proto $keel_odoo_proto;
}

location = /keel-odoo-replica.html {
	internal;
	root /usr/share/keel-odoo/www;
	default_type text/html;
	add_header Cache-Control no-store always;
}

# Odoo 18 serves the bus on /websocket, and the gevent worker on 8072 owns it.
location ^~ /websocket {
	proxy_pass http://127.0.0.1:8072;
	proxy_http_version 1.1;
	proxy_connect_timeout 5s;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
	proxy_redirect off;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $keel_odoo_connection;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Proto $keel_odoo_proto;
}
