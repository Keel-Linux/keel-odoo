# keel-odoo: the routes of Odoo (handbook decision 0059, points 4 and 6),
# included by keel-web's default site and by its server behind Anubis. They
# stand beside /keel-check/ of the lnpp layer.
#
# keel-web's sites end with `location / { try_files ... =404; }`. A second
# `location /` is a duplicate, and so is `location ^~ /` (nginx -t:
# duplicate location "/"). A regular expression is neither. Nginx tries
# the regular expressions after the longest prefix, so `location ~ ^/`
# takes every request that no exact match (/keel-health, /404.html) and no
# prefix with ^~ (/keel-check/, /websocket) took.
#
# Odoo listens on the loopback only, and its cron jobs and writes run on
# the node whose PostgreSQL is writable (usr/lib/keel-odoo/serve.py). On a
# standby nothing listens on 8069, and Nginx answers 502 with the 50x page
# of keel-web.
location ~ ^/ {
	client_max_body_size 256m;
	proxy_pass http://127.0.0.1:8069;
	proxy_http_version 1.1;
	proxy_connect_timeout 5s;
	proxy_read_timeout 720s;
	proxy_send_timeout 720s;
	proxy_redirect off;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Proto $keel_odoo_proto;
}

# Odoo 18 serves the bus on /websocket, and the gevent worker on 8072 owns it.
location ^~ /websocket {
	proxy_pass http://127.0.0.1:8072;
	proxy_http_version 1.1;
	proxy_connect_timeout 5s;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
	proxy_redirect off;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $keel_odoo_connection;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Proto $keel_odoo_proto;
}
